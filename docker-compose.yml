# ============================================================
# ASTRA — Docker Compose (Local Development)
# ============================================================

services:
  # ========================
  # PostgreSQL + pgvector
  # ========================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: astra-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-astra}
      POSTGRES_USER: ${POSTGRES_USER:-astra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - astra-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-astra} -d ${POSTGRES_DB:-astra}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ========================
  # Backend (FastAPI)
  # ========================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: astra-backend
    ports:
      - "${ASTRA_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-astra}:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/${POSTGRES_DB:-astra}
      - ASTRA_ENV=${ASTRA_ENV:-development}
      - ASTRA_DEBUG=${ASTRA_DEBUG:-true}
      - ASTRA_LOG_LEVEL=${ASTRA_LOG_LEVEL:-INFO}
      - ASTRA_CORS_ORIGINS=${ASTRA_CORS_ORIGINS:-http://localhost:5173}
      - ASTRA_AI_PROVIDER=${ASTRA_AI_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  # ========================
  # Frontend (Vite Dev Server)
  # ========================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: astra-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:${ASTRA_PORT:-8000}
    depends_on:
      - backend

volumes:
  astra-pgdata:
